<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter, Arial, sans-serif">
  <title>Gap scores for big data in the Colombian public sector</title>
  <!-- scale: x=300 is 0, 40px per point; x=700 is 10 -->
  <g stroke="#e3e8ee" stroke-width="1">
    <line x1="300" y1="20" x2="300" y2="340"/><line x1="340" y1="20" x2="340" y2="340"/>
    <line x1="380" y1="20" x2="380" y2="340"/><line x1="420" y1="20" x2="420" y2="340"/>
    <line x1="460" y1="20" x2="460" y2="340"/><line x1="500" y1="20" x2="500" y2="340"/>
    <line x1="540" y1="20" x2="540" y2="340"/><line x1="580" y1="20" x2="580" y2="340"/>
    <line x1="620" y1="20" x2="620" y2="340"/><line x1="660" y1="20" x2="660" y2="340"/>
    <line x1="700" y1="20" x2="700" y2="340"/>
  </g>
  <g font-size="12" fill="#5b6b7a" text-anchor="middle">
    <text x="300" y="358">0</text><text x="340" y="358">1</text><text x="380" y="358">2</text>
    <text x="420" y="358">3</text><text x="460" y="358">4</text><text x="500" y="358">5</text>
    <text x="540" y="358">6</text><text x="580" y="358">7</text><text x="620" y="358">8</text>
    <text x="660" y="358">9</text><text x="700" y="358">10</text>
  </g>
  <text x="290" y="384" font-size="12" fill="#5b6b7a">0 = no gap</text>
  <text x="710" y="384" font-size="12" fill="#5b6b7a" text-anchor="end">10 = radical gap</text>
  <text x="500" y="384" font-size="12" font-weight="700" fill="#5b6b7a" text-anchor="middle">gap size</text>

  <g font-size="14" fill="#2c3e50" text-anchor="end">
    <text x="288" y="47">Information</text>
    <text x="288" y="91">Processes</text>
    <text x="288" y="135">Objectives &amp; values</text>
    <text x="288" y="179">Skills &amp; knowledge</text>
    <text x="288" y="223">Management systems &amp; structures</text>
    <text x="288" y="267">Technology</text>
    <text x="288" y="311">Other resources</text>
  </g>
  <g>
    <rect x="300" y="28" width="280" height="28" fill="#e03131"/>
    <rect x="300" y="72" width="280" height="28" fill="#e03131"/>
    <rect x="300" y="116" width="280" height="28" fill="#e03131"/>
    <rect x="300" y="160" width="280" height="28" fill="#e03131"/>
    <rect x="300" y="204" width="280" height="28" fill="#e03131"/>
    <rect x="300" y="248" width="240" height="28" fill="#f76707"/>
    <rect x="300" y="292" width="200" height="28" fill="#f2b705"/>
  </g>
  <g font-size="14" font-weight="800" fill="#2c3e50">
    <text x="588" y="47">7</text><text x="588" y="91">7</text><text x="588" y="135">7</text>
    <text x="588" y="179">7</text><text x="588" y="223">7</text><text x="548" y="267">6</text>
    <text x="508" y="311">5</text>
  </g>
  <text x="700" y="311" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="end">Total = 46 / 70</text>
</svg>
