<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Inter, Arial, sans-serif">
  <title>Robert Moses' low overpasses let cars through but block 12-foot buses</title>
  <!-- road -->
  <rect x="0" y="250" width="760" height="40" fill="#adb5bd"/>
  <g stroke="#ffffff" stroke-width="4" stroke-dasharray="30 22"><line x1="0" y1="270" x2="760" y2="270"/></g>
  <!-- overpass -->
  <rect x="300" y="60" width="160" height="40" fill="#868e96"/>
  <rect x="300" y="100" width="22" height="150" fill="#868e96"/>
  <rect x="438" y="100" width="22" height="150" fill="#868e96"/>
  <text x="380" y="86" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Parkway overpass</text>
  <!-- clearance marker -->
  <line x1="476" y1="100" x2="476" y2="250" stroke="#d9480f" stroke-width="2"/>
  <line x1="468" y1="100" x2="484" y2="100" stroke="#d9480f" stroke-width="2"/>
  <line x1="468" y1="250" x2="484" y2="250" stroke="#d9480f" stroke-width="2"/>
  <text x="490" y="170" font-size="13" font-weight="700" fill="#d9480f">extraordinarily</text>
  <text x="490" y="188" font-size="13" font-weight="700" fill="#d9480f">low clearance</text>

  <!-- car passing -->
  <g>
    <rect x="335" y="205" width="90" height="34" rx="10" fill="#2f6db5"/>
    <rect x="352" y="190" width="54" height="22" rx="6" fill="#74a9e6"/>
    <circle cx="355" cy="242" r="9" fill="#212529"/><circle cx="405" cy="242" r="9" fill="#212529"/>
  </g>
  <text x="380" y="310" font-size="12.5" fill="#1f4f8a" text-anchor="middle" font-weight="700">private car passes</text>

  <!-- bus blocked -->
  <g>
    <rect x="70" y="80" width="190" height="160" rx="12" fill="#f2b705"/>
    <g fill="#ffffff"><rect x="88" y="98" width="36" height="36" rx="4"/><rect x="134" y="98" width="36" height="36" rx="4"/><rect x="180" y="98" width="36" height="36" rx="4"/></g>
    <text x="165" y="175" font-size="15" font-weight="800" fill="#3a2a00" text-anchor="middle">PUBLIC BUS</text>
    <text x="165" y="195" font-size="12.5" fill="#3a2a00" text-anchor="middle">12 feet tall</text>
    <circle cx="105" cy="242" r="11" fill="#212529"/><circle cx="225" cy="242" r="11" fill="#212529"/>
  </g>
  <line x1="262" y1="80" x2="300" y2="80" stroke="#e03131" stroke-width="3"/>
  <text x="280" y="40" font-size="26" font-weight="900" fill="#e03131" text-anchor="middle">✕</text>
  <text x="165" y="310" font-size="12.5" fill="#a61e1e" text-anchor="middle" font-weight="700">poor and Black residents on transit kept off</text>

  <text x="620" y="60" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">~200 low overpasses,</text>
  <text x="620" y="78" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">Long Island, New York</text>
  <text x="620" y="100" font-size="12" fill="#5b6b7a" text-anchor="middle">designed by Robert Moses</text>
  <text x="620" y="118" font-size="12" fill="#5b6b7a" text-anchor="middle">→ parkways and beaches</text>
  <text x="620" y="136" font-size="12" fill="#5b6b7a" text-anchor="middle">for car-owning classes</text>
</svg>
