<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Inter, Arial, sans-serif">
  <title>A telecommunication network: terminals, links, nodes and the address space</title>
  <!-- address space boundary -->
  <rect x="14" y="14" width="732" height="340" rx="22" fill="#f4f7fb" stroke="#2f6db5" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="34" y="44" font-size="16" font-weight="800" fill="#1f4f8a">Address space = the collection of all addresses in the network</text>

  <!-- links -->
  <g stroke="#5b6b7a" stroke-width="3" fill="none">
    <line x1="130" y1="120" x2="290" y2="190"/>
    <line x1="130" y1="270" x2="290" y2="210"/>
    <line x1="310" y1="200" x2="470" y2="200"/>
    <line x1="490" y1="190" x2="630" y2="110"/>
    <line x1="490" y1="210" x2="630" y2="290"/>
    <line x1="300" y1="210" x2="480" y2="300"/>
  </g>
  <!-- highlighted route -->
  <g stroke="#d9480f" stroke-width="4" fill="none" stroke-dasharray="2 7" stroke-linecap="round">
    <path d="M140 112 L292 180 L470 188 L622 102"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="300" cy="200" r="24" fill="#e6f4f1" stroke="#0f8a7e" stroke-width="3"/>
    <text x="300" y="205" font-size="13" font-weight="800" fill="#0b6b62" text-anchor="middle">N1</text>
    <circle cx="480" cy="200" r="24" fill="#e6f4f1" stroke="#0f8a7e" stroke-width="3"/>
    <text x="480" y="205" font-size="13" font-weight="800" fill="#0b6b62" text-anchor="middle">N2</text>
    <circle cx="480" cy="300" r="20" fill="#e6f4f1" stroke="#0f8a7e" stroke-width="3"/>
    <text x="480" y="305" font-size="13" font-weight="800" fill="#0b6b62" text-anchor="middle">N3</text>
  </g>

  <!-- terminals -->
  <g font-size="12.5" fill="#2c3e50">
    <rect x="50" y="92" width="96" height="52" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2.5"/>
    <text x="98" y="114" text-anchor="middle" font-weight="700">Terminal A</text>
    <text x="98" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace">addr 101</text>

    <rect x="50" y="244" width="96" height="52" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2.5"/>
    <text x="98" y="266" text-anchor="middle" font-weight="700">Terminal B</text>
    <text x="98" y="284" text-anchor="middle" font-family="JetBrains Mono, monospace">addr 102</text>

    <rect x="614" y="84" width="96" height="52" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2.5"/>
    <text x="662" y="106" text-anchor="middle" font-weight="700">Terminal C</text>
    <text x="662" y="124" text-anchor="middle" font-family="JetBrains Mono, monospace">addr 201</text>

    <rect x="614" y="264" width="96" height="52" rx="8" fill="#fff4e0" stroke="#d98a00" stroke-width="2.5"/>
    <text x="662" y="286" text-anchor="middle" font-weight="700">Terminal D</text>
    <text x="662" y="304" text-anchor="middle" font-family="JetBrains Mono, monospace">addr 202</text>
  </g>

  <text x="390" y="220" font-size="12" fill="#5b6b7a" text-anchor="middle">link</text>
  <text x="400" y="96" font-size="12.5" fill="#d9480f" font-weight="700" text-anchor="middle">message to addr 201</text>
  <text x="400" y="112" font-size="12.5" fill="#d9480f" font-weight="700" text-anchor="middle">is routed A → N1 → N2 → C</text>

  <!-- legend -->
  <g font-size="13" fill="#2c3e50">
    <rect x="40" y="374" width="22" height="16" rx="3" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/>
    <text x="70" y="387"><tspan font-weight="700">Terminal</tspan> — end device of a user, has a unique address</text>
    <circle cx="51" cy="404" r="8" fill="#e6f4f1" stroke="#0f8a7e" stroke-width="2"/>
    <text x="70" y="409"><tspan font-weight="700">Node</tspan> — connection point that passes messages on</text>
    <line x1="470" y1="382" x2="500" y2="382" stroke="#5b6b7a" stroke-width="3"/>
    <text x="508" y="387"><tspan font-weight="700">Link</tspan> — connection between two points</text>
    <line x1="470" y1="404" x2="500" y2="404" stroke="#d9480f" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round"/>
    <text x="508" y="409">Route chosen using the address</text>
  </g>
</svg>
