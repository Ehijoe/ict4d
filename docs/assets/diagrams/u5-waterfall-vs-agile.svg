<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Inter, Arial, sans-serif">
  <title>Waterfall cascade versus agile sprints</title>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/>
    </marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f8a7e"/>
    </marker>
  </defs>

  <!-- Waterfall -->
  <text x="190" y="28" font-size="17" font-weight="800" fill="#1f4f8a" text-anchor="middle">Waterfall</text>
  <text x="190" y="46" font-size="12" fill="#5b6b7a" text-anchor="middle">each stage finishes before the next begins</text>
  <g font-size="13" font-weight="700" fill="#1f4f8a">
    <rect x="20"  y="62"  width="150" height="38" rx="6" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/><text x="95"  y="86" text-anchor="middle">1 · Analysis</text>
    <rect x="65"  y="112" width="150" height="38" rx="6" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/><text x="140" y="136" text-anchor="middle">2 · Design</text>
    <rect x="110" y="162" width="150" height="38" rx="6" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/><text x="185" y="186" text-anchor="middle">3 · Development</text>
    <rect x="155" y="212" width="150" height="38" rx="6" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/><text x="230" y="236" text-anchor="middle">4 · QA testing</text>
    <rect x="200" y="262" width="150" height="38" rx="6" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/><text x="275" y="286" text-anchor="middle">5 · Go live</text>
    <rect x="200" y="312" width="150" height="38" rx="6" fill="#fdecec" stroke="#e03131" stroke-width="2"/><text x="275" y="336" text-anchor="middle" fill="#a61e1e">6 · Fix defects</text>
  </g>
  <g stroke="#2f6db5" stroke-width="2" fill="none" marker-end="url(#d)">
    <path d="M170 81 H 190 V 110"/><path d="M215 131 H 235 V 160"/><path d="M260 181 H 280 V 210"/>
    <path d="M305 231 H 325 V 260"/><path d="M275 300 V 310"/>
  </g>
  <g font-size="11.5" fill="#2c3e50">
    <text x="20" y="372">Fixed scope in paperwork · formal, bureaucratic</text>
    <text x="20" y="390">Late change = revise documents + code → costly</text>
  </g>

  <line x1="390" y1="20" x2="390" y2="390" stroke="#d6dde5" stroke-width="2"/>

  <!-- Agile -->
  <text x="590" y="28" font-size="17" font-weight="800" fill="#0b6b62" text-anchor="middle">Agile</text>
  <text x="590" y="46" font-size="12" fill="#5b6b7a" text-anchor="middle">evolutionary path · built in short iterations (sprints)</text>
  <g font-size="12.5" fill="#0b6b62" font-weight="700">
    <circle cx="470" cy="160" r="52" fill="#e6f4f1" stroke="#0f8a7e" stroke-width="2.5"/>
    <text x="470" y="156" text-anchor="middle">Sprint 1</text><text x="470" y="174" text-anchor="middle" font-weight="400" font-size="11.5">plan·build·review</text>
    <circle cx="590" cy="160" r="52" fill="#e6f4f1" stroke="#0f8a7e" stroke-width="2.5"/>
    <text x="590" y="156" text-anchor="middle">Sprint 2</text><text x="590" y="174" text-anchor="middle" font-weight="400" font-size="11.5">plan·build·review</text>
    <circle cx="710" cy="160" r="52" fill="#e6f4f1" stroke="#0f8a7e" stroke-width="2.5"/>
    <text x="710" y="156" text-anchor="middle">Sprint 3 …</text><text x="710" y="174" text-anchor="middle" font-weight="400" font-size="11.5">plan·build·review</text>
  </g>
  <g stroke="#0f8a7e" stroke-width="2.5" fill="none" marker-end="url(#t)">
    <path d="M522 160 H 536"/><path d="M642 160 H 656"/>
  </g>
  <g font-size="12" fill="#2c3e50" text-anchor="middle">
    <text x="530" y="240">↑ after each sprint, team + customer see progress;</text>
    <text x="530" y="258">changes go into the next sprint's plan</text>
  </g>
  <g font-size="11.5" fill="#2c3e50">
    <text x="410" y="300">• Self-organised, cross-functional teams</text>
    <text x="410" y="320">• Less paperwork, faster decisions</text>
    <text x="410" y="340">• Customer can react to the market cheaply</text>
    <text x="410" y="372" font-weight="700" fill="#0b6b62">"Tames the change" — cheaper than a fixed scope</text>
  </g>
</svg>
