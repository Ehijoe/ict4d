<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Inter, Arial, sans-serif">
  <title>Divergence and convergence in participatory design</title>
  <polygon points="80,150 380,40 380,260" fill="#fff4e0" stroke="#d98a00" stroke-width="3"/>
  <polygon points="380,40 680,150 380,260" fill="#e6f4f1" stroke="#0f8a7e" stroke-width="3"/>
  <circle cx="80" cy="150" r="10" fill="#2c3e50"/>
  <circle cx="680" cy="150" r="10" fill="#2c3e50"/>
  <text x="80" y="185" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">Set goals</text>
  <text x="680" y="185" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">Most viable design</text>

  <text x="265" y="132" font-size="20" font-weight="800" fill="#a86500" text-anchor="middle">DIVERGE</text>
  <g font-size="12.5" fill="#2c3e50" text-anchor="middle">
    <text x="270" y="156">brainstorm as many</text>
    <text x="270" y="174">ideas as possible; others say</text>
    <text x="290" y="192">likes + improvements</text>
  </g>
  <text x="500" y="132" font-size="20" font-weight="800" fill="#0b6b62" text-anchor="middle">CONVERGE</text>
  <g font-size="12.5" fill="#2c3e50" text-anchor="middle">
    <text x="500" y="156">review all solutions, ideas</text>
    <text x="500" y="174">and feedback; combine into</text>
    <text x="500" y="192">the most viable design</text>
  </g>
  <g font-size="12" fill="#5b6b7a" text-anchor="middle">
    <text x="380" y="284">Goal: shorten the time from divergence to convergence — clear ground rules make this possible.</text>
  </g>
  <text x="380" y="30" font-size="12" fill="#5b6b7a" text-anchor="middle">number of ideas ↕</text>
</svg>
