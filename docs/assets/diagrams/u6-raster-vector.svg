<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Inter, Arial, sans-serif">
  <title>Raster versus vector GIS formats</title>
  <text x="190" y="28" font-size="17" font-weight="800" fill="#2c3e50" text-anchor="middle">Raster — grid of cells (pixels)</text>
  <g transform="translate(70,44)" stroke="#ffffff" stroke-width="1">
    <!-- 8x8 elevation grid, darker = higher -->
    <rect x="0"   y="0"   width="30" height="30" fill="#d3f9d8"/><rect x="30"  y="0"   width="30" height="30" fill="#d3f9d8"/><rect x="60"  y="0"   width="30" height="30" fill="#b2f2bb"/><rect x="90"  y="0"   width="30" height="30" fill="#8ce99a"/><rect x="120" y="0"   width="30" height="30" fill="#8ce99a"/><rect x="150" y="0"   width="30" height="30" fill="#b2f2bb"/><rect x="180" y="0"   width="30" height="30" fill="#d3f9d8"/><rect x="210" y="0"   width="30" height="30" fill="#d3f9d8"/>
    <rect x="0"   y="30"  width="30" height="30" fill="#d3f9d8"/><rect x="30"  y="30"  width="30" height="30" fill="#b2f2bb"/><rect x="60"  y="30"  width="30" height="30" fill="#8ce99a"/><rect x="90"  y="30"  width="30" height="30" fill="#51cf66"/><rect x="120" y="30"  width="30" height="30" fill="#51cf66"/><rect x="150" y="30"  width="30" height="30" fill="#8ce99a"/><rect x="180" y="30"  width="30" height="30" fill="#b2f2bb"/><rect x="210" y="30"  width="30" height="30" fill="#d3f9d8"/>
    <rect x="0"   y="60"  width="30" height="30" fill="#b2f2bb"/><rect x="30"  y="60"  width="30" height="30" fill="#8ce99a"/><rect x="60"  y="60"  width="30" height="30" fill="#51cf66"/><rect x="90"  y="60"  width="30" height="30" fill="#2f9e44"/><rect x="120" y="60"  width="30" height="30" fill="#2f9e44"/><rect x="150" y="60"  width="30" height="30" fill="#51cf66"/><rect x="180" y="60"  width="30" height="30" fill="#8ce99a"/><rect x="210" y="60"  width="30" height="30" fill="#b2f2bb"/>
    <rect x="0"   y="90"  width="30" height="30" fill="#b2f2bb"/><rect x="30"  y="90"  width="30" height="30" fill="#8ce99a"/><rect x="60"  y="90"  width="30" height="30" fill="#51cf66"/><rect x="90"  y="90"  width="30" height="30" fill="#2b8a3e"/><rect x="120" y="90"  width="30" height="30" fill="#2b8a3e"/><rect x="150" y="90"  width="30" height="30" fill="#51cf66"/><rect x="180" y="90"  width="30" height="30" fill="#8ce99a"/><rect x="210" y="90"  width="30" height="30" fill="#b2f2bb"/>
    <rect x="0"   y="120" width="30" height="30" fill="#d3f9d8"/><rect x="30"  y="120" width="30" height="30" fill="#b2f2bb"/><rect x="60"  y="120" width="30" height="30" fill="#8ce99a"/><rect x="90"  y="120" width="30" height="30" fill="#51cf66"/><rect x="120" y="120" width="30" height="30" fill="#51cf66"/><rect x="150" y="120" width="30" height="30" fill="#8ce99a"/><rect x="180" y="120" width="30" height="30" fill="#b2f2bb"/><rect x="210" y="120" width="30" height="30" fill="#d3f9d8"/>
    <rect x="0"   y="150" width="30" height="30" fill="#d3f9d8"/><rect x="30"  y="150" width="30" height="30" fill="#d3f9d8"/><rect x="60"  y="150" width="30" height="30" fill="#b2f2bb"/><rect x="90"  y="150" width="30" height="30" fill="#8ce99a"/><rect x="120" y="150" width="30" height="30" fill="#8ce99a"/><rect x="150" y="150" width="30" height="30" fill="#b2f2bb"/><rect x="180" y="150" width="30" height="30" fill="#d3f9d8"/><rect x="210" y="150" width="30" height="30" fill="#d3f9d8"/>
  </g>
  <g font-size="12.5" fill="#2c3e50">
    <text x="70" y="250">Each cell holds one value (here: elevation,</text>
    <text x="70" y="268">darker = higher). Good for data that</text>
    <text x="70" y="286" font-weight="700">varies continuously:</text>
    <text x="70" y="304">elevation, satellite imagery</text>
  </g>

  <line x1="380" y1="20" x2="380" y2="320" stroke="#d6dde5" stroke-width="2"/>

  <text x="570" y="28" font-size="17" font-weight="800" fill="#2c3e50" text-anchor="middle">Vector — points, lines, polygons</text>
  <g>
    <polygon points="430,60 560,50 580,140 450,160" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2.5"/>
    <text x="505" y="110" font-size="12" font-weight="700" fill="#1f4f8a" text-anchor="middle">School district</text>
    <polygon points="580,140 700,120 720,200 600,215" fill="#fff4e0" stroke="#d98a00" stroke-width="2.5"/>
    <text x="655" y="175" font-size="12" font-weight="700" fill="#a86500" text-anchor="middle">Park</text>
    <path d="M420 200 L 520 190 L 600 215 L 730 230" stroke="#495057" stroke-width="4" fill="none"/>
    <text x="470" y="186" font-size="12" fill="#495057">street (line)</text>
    <g fill="#d9480f">
      <circle cx="430" cy="60" r="5"/><circle cx="560" cy="50" r="5"/><circle cx="580" cy="140" r="5"/><circle cx="450" cy="160" r="5"/>
      <circle cx="700" cy="120" r="5"/><circle cx="720" cy="200" r="5"/><circle cx="600" cy="215" r="5"/>
    </g>
    <text x="566" y="44" font-size="11" fill="#d9480f">node</text>
  </g>
  <g font-size="12.5" fill="#2c3e50">
    <text x="410" y="250">Shapes defined by points (nodes) joined</text>
    <text x="410" y="268">by lines. Good for data with</text>
    <text x="410" y="286" font-weight="700">firm borders:</text>
    <text x="410" y="304">school districts, streets</text>
  </g>
</svg>
