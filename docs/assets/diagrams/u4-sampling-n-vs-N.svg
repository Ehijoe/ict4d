<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" font-family="Inter, Arial, sans-serif">
  <title>Sampling: survey sample, big data ideal n = N, and big data under the digital divide</title>
  <defs>
    <!-- population: 6 x 6 grid of people; reused in each panel -->
    <g id="pop">
      <g fill="#cfd6de">
        <circle cx="20" cy="20" r="8"/><circle cx="50" cy="20" r="8"/><circle cx="80" cy="20" r="8"/><circle cx="110" cy="20" r="8"/><circle cx="140" cy="20" r="8"/><circle cx="170" cy="20" r="8"/>
        <circle cx="20" cy="50" r="8"/><circle cx="50" cy="50" r="8"/><circle cx="80" cy="50" r="8"/><circle cx="110" cy="50" r="8"/><circle cx="140" cy="50" r="8"/><circle cx="170" cy="50" r="8"/>
        <circle cx="20" cy="80" r="8"/><circle cx="50" cy="80" r="8"/><circle cx="80" cy="80" r="8"/><circle cx="110" cy="80" r="8"/><circle cx="140" cy="80" r="8"/><circle cx="170" cy="80" r="8"/>
        <circle cx="20" cy="110" r="8"/><circle cx="50" cy="110" r="8"/><circle cx="80" cy="110" r="8"/><circle cx="110" cy="110" r="8"/><circle cx="140" cy="110" r="8"/><circle cx="170" cy="110" r="8"/>
        <circle cx="20" cy="140" r="8"/><circle cx="50" cy="140" r="8"/><circle cx="80" cy="140" r="8"/><circle cx="110" cy="140" r="8"/><circle cx="140" cy="140" r="8"/><circle cx="170" cy="140" r="8"/>
        <circle cx="20" cy="170" r="8"/><circle cx="50" cy="170" r="8"/><circle cx="80" cy="170" r="8"/><circle cx="110" cy="170" r="8"/><circle cx="140" cy="170" r="8"/><circle cx="170" cy="170" r="8"/>
      </g>
    </g>
  </defs>

  <!-- Panel 1: survey -->
  <rect x="10" y="10" width="245" height="330" rx="14" fill="#f7f9fb" stroke="#9aa5b1"/>
  <text x="132" y="38" font-size="15" font-weight="800" fill="#2c3e50" text-anchor="middle">Traditional survey</text>
  <text x="132" y="56" font-size="12.5" fill="#5b6b7a" text-anchor="middle">random sample: n ≪ N</text>
  <g transform="translate(37,70)">
    <use href="#pop"/>
    <g fill="#2f6db5">
      <circle cx="50" cy="20" r="8"/><circle cx="140" cy="50" r="8"/><circle cx="20" cy="110" r="8"/>
      <circle cx="110" cy="140" r="8"/><circle cx="170" cy="170" r="8"/><circle cx="80" cy="80" r="8"/>
    </g>
  </g>
  <text x="132" y="278" font-size="12.5" fill="#2c3e50" text-anchor="middle">Small, costly, slow — but chosen</text>
  <text x="132" y="296" font-size="12.5" fill="#2c3e50" text-anchor="middle">to represent everyone</text>

  <!-- Panel 2: ideal -->
  <rect x="267" y="10" width="245" height="330" rx="14" fill="#f2faf7" stroke="#0f8a7e"/>
  <text x="389" y="38" font-size="15" font-weight="800" fill="#0b6b62" text-anchor="middle">Big data ideal</text>
  <text x="389" y="56" font-size="12.5" fill="#5b6b7a" text-anchor="middle">universal sampling: n = N</text>
  <g transform="translate(294,70)">
    <use href="#pop"/>
  </g>
  <rect x="294" y="70" width="190" height="190" rx="10" fill="#0f8a7e" fill-opacity="0.18" stroke="#0f8a7e" stroke-width="2"/>
  <text x="389" y="278" font-size="12.5" fill="#2c3e50" text-anchor="middle">"Capture all there is" — every</text>
  <text x="389" y="296" font-size="12.5" fill="#2c3e50" text-anchor="middle">phone user leaves a footprint</text>

  <!-- Panel 3: reality -->
  <rect x="524" y="10" width="245" height="330" rx="14" fill="#fff6f2" stroke="#d9480f"/>
  <text x="646" y="38" font-size="15" font-weight="800" fill="#a8380b" text-anchor="middle">Reality: digital divide</text>
  <text x="646" y="56" font-size="12.5" fill="#5b6b7a" text-anchor="middle">n = only those connected</text>
  <g transform="translate(551,70)">
    <use href="#pop"/>
  </g>
  <rect x="551" y="70" width="190" height="66" rx="10" fill="#d9480f" fill-opacity="0.2" stroke="#d9480f" stroke-width="2"/>
  <text x="646" y="278" font-size="12.5" font-weight="700" fill="#a8380b" text-anchor="middle">Shaded = privileged strata who own phones</text>
  <text x="646" y="298" font-size="12.5" fill="#2c3e50" text-anchor="middle">Rwanda 2005–09: 2–20% penetration</text>
  <text x="646" y="316" font-size="12.5" fill="#2c3e50" text-anchor="middle">→ sample not representative</text>
</svg>
