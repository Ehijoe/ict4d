<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter, Arial, sans-serif">
  <title>Four types of e-government: G2C, G2B, G2G, G2E</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
    </marker>
  </defs>
  <g stroke="#5b6b7a" stroke-width="2.5" marker-start="url(#b)" marker-end="url(#b)">
    <line x1="300" y1="170" x2="190" y2="110"/>
    <line x1="460" y1="170" x2="570" y2="110"/>
    <line x1="300" y1="230" x2="190" y2="290"/>
    <line x1="460" y1="230" x2="570" y2="290"/>
  </g>
  <rect x="290" y="150" width="180" height="100" rx="14" fill="#1f4f8a"/>
  <text x="380" y="192" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">GOVERNMENT</text>
  <text x="380" y="216" font-size="12" fill="#dbe7f6" text-anchor="middle">ICT, esp. web-based</text>
  <text x="380" y="232" font-size="12" fill="#dbe7f6" text-anchor="middle">Internet applications</text>

  <g font-size="12" fill="#2c3e50">
    <rect x="20" y="20" width="250" height="110" rx="12" fill="#e6f4f1" stroke="#0f8a7e" stroke-width="2"/>
    <text x="34" y="44" font-size="16" font-weight="800" fill="#0b6b62">G2C · Citizens</text>
    <text x="34" y="64">Most common type</text>
    <text x="34" y="82">Public info on websites; less time &amp; cost</text>
    <text x="34" y="100">Participation, accountability, democracy</text>
    <text x="34" y="118">e.g. renew driving licence online</text>

    <rect x="490" y="20" width="250" height="110" rx="12" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/>
    <text x="504" y="44" font-size="16" font-weight="800" fill="#a86500">G2B · Businesses</text>
    <text x="504" y="64">Regulations, forms, taxes, licences,</text>
    <text x="504" y="82">registration, permits</text>
    <text x="504" y="100">Efficiency; transparency &amp; equality</text>
    <text x="504" y="118">in government contracting</text>

    <rect x="20" y="270" width="250" height="110" rx="12" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/>
    <text x="34" y="294" font-size="16" font-weight="800" fill="#1f4f8a">G2G · Other government</text>
    <text x="34" y="314">Departments &amp; agencies online,</text>
    <text x="34" y="332">"super government database"</text>
    <text x="34" y="350">Streamlined cooperation &amp; coordination;</text>
    <text x="34" y="368">time and cost savings</text>

    <rect x="490" y="270" width="250" height="110" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
    <text x="504" y="294" font-size="16" font-weight="800" fill="#5f3dc4">G2E · Employees</text>
    <text x="504" y="314">Least researched type</text>
    <text x="504" y="332">Leave, salary records, benefits online</text>
    <text x="504" y="350">e-learning, knowledge sharing</text>
    <text x="504" y="368">among employees</text>
  </g>
</svg>
